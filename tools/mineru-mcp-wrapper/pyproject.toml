[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "flowmate-mineru-mcp-wrapper"
version = "0.1.0"
description = "Flowmate safety wrapper for mineru-open-mcp"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mineru-open-mcp==1.0.21",
]

[project.scripts]
flowmate-mineru-mcp = "flowmate_mineru_mcp.launcher:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flowmate_mineru_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

